# Prompts for the eleven paintings. scripts/paint.py reads this file.
# Each prompt = style + scene + the composition line for the copy side + rules.
#
# Never name what you don't want ("no mountains"): the model reads the word and
# paints it. Describe what is there instead (a flat, level horizon). Anything in
# [style] shows up in every scene, so subjects and scenery stay out of it. Likewise, anything
# named in [style] shows up in every scene, so keep subjects (reeds, grass) out of it.
#
# reference: a layout photo in production/references/ (see its README for
# credits); strength 0-1 is how closely the painting follows it.

[style]
text = """Ink-wash painting in the traditional sumi-e manner, on warm cream handmade mulberry paper \
with long visible fibers and small flecks. Confident wet brushwork: layered gray and sepia ink \
washes, soft wet edges, ink pooling and bleeding into the paper, dry-brush texture. Warm, earthy \
palette: tan, ochre and muted sepia, with small touches of muted teal in water."""
# Added to scenes with open country (flat = true). Western Ohio is dead flat.
flat = """The land is perfectly flat in every direction, and the horizon is one long, straight, \
level line where a wide pale sky meets the land, broken only by a thin, low band of distant trees."""
rules = "The painting is unsigned and has no writing on it."
# Ignored by Z-Image Turbo (it runs without guidance), kept for models that use it.
negative = "text, lettering, signature, stamp, border, frame, photograph"

[composition]
left = """The painting fills the entire frame edge to edge with no border. The main subject \
sits in the right two-thirds; the left third is pale sky, mist and bare paper with almost no detail."""
right = """The painting fills the entire frame edge to edge with no border. The main subject \
sits in the left two-thirds; the right third is pale sky, mist and bare paper with almost no detail."""
bottom = """The painting fills the entire frame edge to edge with no border. The main subject \
sits in the upper two-thirds; the bottom third is still water or mist with almost no detail."""

[[scene]]
file = "01-divide"
flat = true
copy = "left"
seed = 1832
text = """A flat wetland at dawn on the edge of a great swamp, before any settlement: reeds and \
standing water around a barely raised rise of land crowned with a few gnarled, leafless trees; \
two thin streams leave the rise in opposite directions. Heavy morning mist dissolves the \
distant tree line."""

